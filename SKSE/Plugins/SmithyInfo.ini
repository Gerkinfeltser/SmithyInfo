[SmithyInfo]
; Log level: trace, debug, info, warn, error, critical, off
sLogLevel = info

; Hide tempering info for enchanted items if player lacks Arcane Blacksmith perk
; Set to 0 to always show tempering info regardless of perk
bGateEnchantedTempering =1

; FormID of the Arcane Blacksmith perk (hex, no 0x prefix)
; Change only if another mod replaces the perk with a different form
sArcaneBlacksmithPerkFormID =0005218E

; DIII (Dynamic Inventory Icon Injector) integration
; Registers smithySmelt and smithyTemper conditions with DIII for icon display
; Requires DIII to be installed and rules file in Data/SKSE/Plugins/DIII/
;
; Behavior:
;   DIII installed + bDIIIIntegration=1  → DIII icons shown (text indicators hidden)
;   DIII installed + bDIIIIntegration=0  → text indicators shown (icons disabled)
;   DIII NOT installed                   → text indicators shown (automatic fallback)
bDIIIIntegration =1

; Effects text on item card (right side) — per menu type (1 = show, 0 = hide)
; Alternative to DIII icons — shows "Smelts into:" / "Tempers with:" text
bEffectsPlayer =1
bEffectsContainer =1
bEffectsMerchant =1

; Name indicators on inventory list (left side) — per menu type (1 = show, 0 = hide)
; Controls visibility for both text indicators (|s|, |t|) AND DIII icons
; With DIII enabled (default), set to 1 to show icons on list items
bIndicatorPlayer =1
bIndicatorContainer =1
bIndicatorMerchant =1

; Indicator format if DIII is not found or disabled(single characters only)
; sIndicatorPrefix: symbol before the letters (default: |)
; sIndicatorSuffix: symbol after the letters (default: |)
; sIndicatorSmelt: single letter for smelting (default: S)
; sIndicatorTemper: single letter for tempering (default: T)
; Format: " prefix + temper + smelt + suffix" (e.g. "|TS|" for both)
sIndicatorPrefix =|
sIndicatorSuffix =|
sIndicatorSmelt =S
sIndicatorTemper =T

; Locked indicators — shown when recipe exists but conditions are not met
; (skill level too low, missing perks, quest gates, etc.)
sIndicatorSmeltLocked =S?
sIndicatorTemperLocked =T?

; Hide locked indicators entirely (1 = no icon/text for locked items, 0 = show locked)
bHideLockedIndicators =0

; Show locked tempering/smelting materials in item card effects text
; When 1, locked recipes show materials with a (locked) marker, e.g. "Tempers with (locked): 1 Steel Ingot"
; This can also show enchanted tempering materials as locked when Arcane Blacksmith is missing
; When 0, locked recipes are hidden from effects text
bShowLockedMaterials =1

; Item filter list - comma-separated hex FormIDs (no 0x prefix)
; Empty list = no filtering regardless of mode
; Example (filters Imperial Sword of Long Embers & Hunting Bow):sFilterItems =0D003882,00013985
sFilterItems =

; Filter mode: 1 = suppress SmithyInfo for listed FormIDs, 0 = show SmithyInfo only for listed FormIDs
bFilterIsBlacklist =1

; SKSE Menu Framework (SMF) integration — in-game settings menu (optional QOL)
; Requires SKSE Menu Framework to be installed: https://www.nexusmods.com/skyrimspecialedition/mods/120352
; When enabled and SMF is installed, adds an in-game settings panel under SmithyInfo > Settings
; Settings take effect immediately; use the Save button to persist changes to this INI
; If SMF is not installed, this setting has no effect — everything works via INI only
bSMFIntegration = 1
